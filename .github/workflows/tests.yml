# Runs the tests on every push and pull request, then rebuilds the ranking from the
# committed tables to confirm it still matches. (The full run downloads about 1 GB of
# spatial data, so it is run by hand: python src/run_all.py)
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Rebuild the ranking from the committed tables
        run: |
          python src/run_all.py --only rank
          git diff --exit-code data/processed/
